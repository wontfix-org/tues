[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tues"
description = "Remote command execution over SSH/SFTP with sudo elevation (sync and asyncio)"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Networking",
]
dynamic = ["version"]
dependencies = [
    "click>=8.1",
    "requests>=2.4",
]

[project.urls]
Repository = "https://github.com/mvb/tues-rs"

[project.scripts]
tues = "tues.__main__:main"
tues-provider-fm = "tues.provider_fm:main"

[dependency-groups]
dev = ["maturin>=1.7,<2.0", "pytest>=8", "coverage>=7", "testcontainers>=4.10,<5"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.coverage.run]
source = ["python/tues"]
parallel = true

[tool.maturin]
python-source = "python"
module-name = "tues._tues"
manifest-path = "crates/tues-python/Cargo.toml"
features = ["pyo3/extension-module"]
