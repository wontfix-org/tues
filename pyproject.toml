[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tues"
description = "Remote command execution over SSH/SFTP with sudo elevation (sync and asyncio)"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Networking",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/mvb/tues-rs"

[dependency-groups]
dev = ["maturin>=1.7,<2.0", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.maturin]
python-source = "python"
module-name = "tues._tues"
manifest-path = "crates/tues-python/Cargo.toml"
features = ["pyo3/extension-module"]
